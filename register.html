<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | ExamSystem Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .auth-split-left {
            background-image: linear-gradient(135deg, rgba(37, 99, 235, 0.94), rgba(30, 64, 175, 0.94)), url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80');
        }

        select,
        input {
            transition: all 0.2s;
        }

        .dynamic-section {
            padding: 24px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-top: 24px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="brand" style="display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-graduation-cap"></i> ExamSystem <span
                    style="font-weight: 300; opacity: 0.8;">Pro</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Sign In</a>
                <a href="register.html" class="btn-nav-primary">Join Now</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-split-left">
            <div style="max-width: 440px;">
                <h1 style="font-size: 3.5rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -1.5px;">Join the
                    Elite.</h1>
                <p style="font-size: 1.25rem; opacity: 0.9; line-height: 1.6;">Build your academic legacy on a platform
                    designed for the highest standard of intellectual evaluation.</p>
            </div>
        </div>

        <div class="auth-split-right">
            <div class="auth-box" style="max-width: 550px;">
                <div class="auth-header">
                    <h2>Create Scholar Profile</h2>
                    <p style="color: var(--text-muted);">Configure your institutional credentials</p>
                </div>

                <form action="Register.php" method="post" id="regForm">
                    <div class="form-group">
                        <label>Institutional Full Name</label>
                        <div class="input-with-icon">
                            <input type="text" name="name" placeholder="Johnathan Doe" required>
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Institutional Email</label>
                        <div class="input-with-icon">
                            <input type="email" name="email" placeholder="scholar@institution.edu" required>
                            <i class="fas fa-envelope-open-text"></i>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Secure Password</label>
                            <div class="input-with-icon">
                                <input type="password" name="password" id="reg-password" placeholder="••••••••"
                                    required>
                                <i class="fas fa-lock"></i>
                                <i class="fas fa-eye toggle-password"
                                    onclick="togglePassword('reg-password', this)"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Re-verify Password</label>
                            <div class="input-with-icon">
                                <input type="password" name="confirm_password" id="reg-confirm" placeholder="••••••••"
                                    required>
                                <i class="fas fa-shield-check"></i>
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('reg-confirm', this)"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Global Identity Role</label>
                        <div class="input-with-icon">
                            <select name="role" required onchange="toggleFields(this.value)"
                                style="width: 100%; padding: 12px 16px 12px 48px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: white; appearance: none;">
                                <option value="student">Student Account</option>
                                <option value="teacher">Faculty Account</option>
                            </select>
                            <i class="fas fa-id-badge"></i>
                        </div>
                    </div>

                    <div id="studentFields">
                        <div class="form-group">
                            <label>Educational Tier</label>
                            <div class="input-with-icon">
                                <select name="level" id="eduLevel" onchange="toggleLevelFields(this.value)"
                                    style="width: 100%; padding: 12px 16px 12px 48px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: white; appearance: none;">
                                    <option value="">Select Tier</option>
                                    <option value="elementary">Grade School (1-8)</option>
                                    <option value="highschool">Secondary (9-12)</option>
                                    <option value="university">Undergraduate</option>
                                    <option value="master">Post-Graduate</option>
                                </select>
                                <i class="fas fa-graduation-cap"></i>
                            </div>
                        </div>
                        <div id="dynamicStudentFields"></div>
                    </div>

                    <div id="teacherFields" style="display:none;" class="dynamic-section">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Primary Department</label>
                            <div class="input-with-icon">
                                <input type="text" name="department" placeholder="e.g. Theoretical Physics">
                                <i class="fas fa-building-columns"></i>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-block" style="margin-top: 32px;">Initialize Account</button>

                    <p style="text-align: center; margin-top: 32px; color: var(--text-muted);">
                        Possess an account? <a href="login.html"
                            style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        // SweetAlert2 Handling
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            Swal.fire({
                icon: 'error',
                title: 'Registration Blocked',
                text: decodeURIComponent(error),
                confirmButtonColor: '#2563eb'
            });
        }

        function toggleFields(role) {
            const student = document.getElementById('studentFields');
            const teacher = document.getElementById('teacherFields');
            if (role === 'teacher') {
                student.style.display = 'none';
                teacher.style.display = 'block';
            } else {
                student.style.display = 'block';
                teacher.style.display = 'none';
            }
        }

        function toggleLevelFields(level) {
            const container = document.getElementById('dynamicStudentFields');
            container.innerHTML = '';
            if (!level) return;

            container.className = 'dynamic-section';
            let html = '';

            if (level === 'elementary') {
                html = `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group"><label>Grade</label><select name="grade_year" required style="width: 100%; border: 1px solid var(--border); padding: 10px; border-radius: 8px;">
                        ${Array.from({ length: 8 }, (_, i) => `<option value="${i + 1}">Grade ${i + 1}</option>`).join('')}
                    </select></div>
                    <div class="form-group"><label>Section</label><input type="text" name="section" placeholder="e.g. A" required></div>
                </div>`;
            } else if (level === 'highschool') {
                html = `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group"><label>Grade</label><select name="grade_year" required style="width: 100%; border: 1px solid var(--border); padding: 10px; border-radius: 8px;">
                        ${Array.from({ length: 4 }, (_, i) => `<option value="${i + 9}">Grade ${i + 9}</option>`).join('')}
                    </select></div>
                    <div class="form-group"><label>Track</label><input type="text" name="stream" placeholder="Science/Social" required></div>
                </div>`;
            } else if (level === 'university' || level === 'master') {
                html = `<div class="form-group"><label>Major / Dept</label><input type="text" name="department" placeholder="e.g. CS" required></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group"><label>Year</label><select name="grade_year" required style="width: 100%; border: 1px solid var(--border); padding: 10px; border-radius: 8px;">
                        ${[1, 2, 3, 4, 5, 6].map(y => `<option value="${y}">${y} Year</option>`).join('')}
                    </select></div>
                    <div class="form-group"><label>Semester</label><select name="semester" required style="width: 100%; border: 1px solid var(--border); padding: 10px; border-radius: 8px;">
                        <option value="1">1st Sem</option><option value="2">2nd Sem</option>
                    </select></div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>
</body>

</html>
